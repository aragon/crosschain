[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# `CrossChainController` exceeds the 24,576-byte EIP-170 limit unoptimized.
# `runs` trades deployed size against per-call gas: lower favours smaller code.
optimizer = true
optimizer_runs = 200

# The deploy kit reads its topology from JSON. Read-only, and scoped to the one
# place a config lives in THIS repo: the kit's own test fixtures. A CONSUMER of
# the kit needs its own grant for wherever it keeps its config --
# `fs_permissions` is per-project and does not travel with the submodule.
fs_permissions = [
    { access = "read", path = "./test/kit/fixtures" },
]

# CI sets `FOUNDRY_PROFILE: ci`. Without a section to select, forge falls back to
# `default` today but hard-errors on an unknown profile from 1.6 on, which would
# break every job on the next toolchain bump. Declared explicitly, inheriting
# `default`, so the name resolves to something real.
[profile.ci]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[fmt]
single_line_statement_blocks = "preserve"
line_length = 120
int_types = "long"
bracket_spacing = true
multiline_func_header = "all"
quote_style = "double"
tab_width = 4
wrap_comments = true
ignore = ["node_modules", "out", "cache", "lib", "coverage"]